site_name: Olympiad-portal
theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Technology Stack and Architecture:
      - Overview: index.md
      - Architecture: architecture.md
      - Frontend: frontend.md
      - Backend: backend.md
      - Data and Storage: data-storage.md
      - Scheduling: scheduling.md
      - External Integration (EmailJS): external-integration.md
      - Testing: testing.md
      - Bug Tracking: bug-tracking.md
      - CI/CD and Hosting: cicd-hosting.md
      - Version Control: version-control.md
      - Project Methodology: methodology.md
      - Project Management and Tracking: project-management and tracking.md
      - Project Meetings: meetings.md
      - UI Design: ui-design.md
      - System Design : system-design.md
      - System Design Diagram: system-design.jpeg
      - Two Way Signup System: Olympiad_Portal_Two_Way_Signup_LaTeX.pdf
      - RoadMap : roadmap.md 
      - Comprehensive Dev Plan: comprehensive-dev-plan.md
      - UML Diagrams: uml-diagrams.pdf
      - APIs : api.md
      - Postman API Testing: postman-api-testing.md
      - Third Party Code: third-party-code.md
      - Code Quality: Prettier Documentation.pdf
      - User Stories By Role: user-stories-by-role.md
      - User Feedback : userfeedback.md
      - AI Declaration: ai-declaration.md